spring.application.name=sistema-residuos-abacaxi

# H2 em memória
spring.datasource.url=jdbc:h2:mem:abacaxi_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (inspeção das tabelas)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Servidor
server.port=8080

# Segurança — chave de acesso para vendas (RNF03)
app.security.api-key=abacaxi-vendas-2024
app.security.jwt-secret=abacaxi-secret-key-residuos

# Estoque — margem crítica (RF14)
app.estoque.nivel-baixo=50
app.estoque.nivel-critico=20

# Qualidade — margem de peso aceitável em % (RF15)
app.qualidade.margem-peso-percentual=15
